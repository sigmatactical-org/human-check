[package]


name = "sigma-human-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
authors = ["Sigma Tactical Group contributors <https://github.com/sigmatactical-org>"]
homepage = "https://sigmatactical.org"
description = "Self-hosted proof-of-work human verification (ALTCHA) for Sigma public forms"
publish = false

[workspace]

[features]
axum = ["dep:axum", "dep:tracing"]
warp = ["dep:warp"]

[dependencies]
altcha = "0.1.0"
axum = { version = "0.8.9", optional = true, default-features = false, features = ["json"] }
base64 = "0.22.1"
rand = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tracing = { version = "0.1", optional = true }
warp = { version = "0.4.3", optional = true, default-features = false }

[dev-dependencies]
temp-env = "0.3.6"
